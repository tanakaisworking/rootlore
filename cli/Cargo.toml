[package]
name = "rootlore"
version = "0.1.0"
edition = "2021"
description = "Rootlore の CLI。GitHub が正本の Vault を、探す前に取り込んで、読む・探す・書く"

[[bin]]
name = "rootlore"
path = "src/main.rs"

[dependencies]
ureq = { version = "2", features = ["json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tiny_http = "0.12"
dirs = "5"
getrandom = "0.2"
sha1 = "0.10"
sha2 = "0.10"
base64 = "0.22"
diffy = "0.4"

[profile.release]
strip = true
lto = true
