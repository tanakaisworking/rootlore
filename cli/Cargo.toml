[package]
name = "rootlore"
version = "0.2.1"
edition = "2021"
description = "Rootlore の CLI。GitHub が正本の Vault を、探す前に取り込んで、読む・探す・書く"

[[bin]]
name = "rootlore"
path = "src/main.rs"

[dependencies]
ureq = { version = "2", features = ["json"] }
# ureq と同じ TLS。OS の証明書（プロキシの証明書など）を、同梱のルート証明書に足して使う（src/net.rs）
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
rustls-native-certs = "0.8"
webpki-roots = "0.26"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tiny_http = "0.12"
dirs = "5"
getrandom = "0.2"
sha1 = "0.10"
sha2 = "0.10"
base64 = "0.22"
diffy = "0.4"
# rootlore update の署名の確認（アプリの更新と同じ minisign の鍵）
minisign-verify = "0.2"

[profile.release]
strip = true
lto = true
